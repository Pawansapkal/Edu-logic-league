<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arena | EdQuest</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-8">

    <div class="flex justify-between items-center bg-slate-800 p-4 rounded-lg border border-slate-700 mb-8 shadow-lg">
        <div class="text-xl font-bold">Player: <span id="playerName" class="text-blue-400">Loading...</span></div>
        <div class="flex space-x-6">
            <div class="text-lg">Level: <span id="playerLevel" class="font-bold text-emerald-400">0</span></div>
            <div class="text-lg">XP: <span id="playerXP" class="font-bold text-yellow-400">0</span></div>
        </div>
    </div>

    <div class="max-w-2xl mx-auto bg-slate-800 rounded-xl p-8 border border-slate-700 shadow-[0_0_30px_rgba(0,0,0,0.5)] relative overflow-hidden">
        <div class="absolute top-0 right-0 bg-blue-600 text-xs font-bold px-3 py-1 rounded-bl-lg">Current Boss</div>
        
        <h2 id="subjectLabel" class="text-emerald-400 font-semibold mb-2 tracking-wide uppercase">Subject</h2>
        <h1 id="questionText" class="text-3xl font-bold mb-8 text-slate-100">Loading challenge...</h1>

        <div id="optionsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            </div>

        <div id="feedback" class="mt-6 text-center font-bold text-xl hidden"></div>
    </div>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/game_logic.js"></script>
</body>
</html>
